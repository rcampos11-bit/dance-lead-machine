<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Dance Lead Machine</title>
<style>
  :root {
    --navy: #0b1224;
    --navy-light: #131b33;
    --gold: #d4af37;
    --gold-light: #e8c866;
    --text: #f5f0e6;
    --text-dim: #a8a8b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Work Sans', -apple-system, sans-serif;
    background: linear-gradient(135deg, var(--navy) 0%, #060a16 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--navy-light);
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 12px;
    padding: 40px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    color: var(--gold-light);
    margin-bottom: 8px;
  }
  p.sub {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 28px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    background: #0b1224;
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 6px;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 20px;
  }
  input[type="password"]:focus {
    outline: none;
    border-color: var(--gold);
  }
  button {
    width: 100%;
    padding: 13px;
    background: var(--gold);
    color: #0b1224;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: var(--gold-light); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg {
    margin-top: 18px;
    font-size: 14px;
    line-height: 1.5;
    padding: 12px 14px;
    border-radius: 6px;
    display: none;
  }
  .msg.success {
    display: block;
    background: rgba(212,175,55,0.12);
    border: 1px solid rgba(212,175,55,0.3);
    color: var(--gold-light);
  }
  .msg.error {
    display: block;
    background: rgba(220,80,80,0.12);
    border: 1px solid rgba(220,80,80,0.3);
    color: #f0a0a0;
  }
  .back {
    display: inline-block;
    margin-top: 24px;
    color: var(--text-dim);
    font-size: 13px;
    text-decoration: none;
  }
  .back:hover { color: var(--gold-light); }
  #resetForm.hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div id="invalidState" style="display:none;">
      <h1>Invalid or expired link</h1>
      <p class="sub">This password reset link is missing or no longer valid. Please request a new one.</p>
      <a href="/forgot-password.html" class="back">&larr; Request a new link</a>
    </div>

    <div id="validState">
      <h1>Set a new password</h1>
      <p class="sub">Choose a new password for your account.</p>
      <form id="resetForm">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" required minlength="8" placeholder="At least 8 characters">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" placeholder="Re-enter password">
        <button type="submit" id="submitBtn">Reset password</button>
      </form>
      <div class="msg" id="msg"></div>
      <a href="/admin.html" class="back">&larr; Back to login</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const invalidState = document.getElementById('invalidState');
    const validState = document.getElementById('validState');
    const form = document.getElementById('resetForm');
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');

    if (!token) {
      invalidState.style.display = 'block';
      validState.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      msg.className = 'msg';
      msg.textContent = '';

      if (password !== confirmPassword) {
        msg.className = 'msg error';
        msg.textContent = 'Passwords do not match.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Resetting...';

      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json().catch(() => ({}));

        if (res.ok) {
          msg.className = 'msg success';
          msg.textContent = 'Your password has been reset. You can now log in.';
          form.reset();
          form.classList.add('hidden');
        } else {
          msg.className = 'msg error';
          msg.textContent = (data && data.error) || 'This link is invalid or has expired. Please request a new one.';
        }
      } catch (err) {
        msg.className = 'msg error';
        msg.textContent = 'Something went wrong. Please try again in a moment.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Reset password';
      }
    });
  </script>
</body>
</html>

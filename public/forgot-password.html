<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Dance Lead Machine</title>
<style>
  :root {
    --navy: #0b1224;
    --navy-light: #131b33;
    --gold: #d4af37;
    --gold-light: #e8c866;
    --text: #f5f0e6;
    --text-dim: #a8a8b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Work Sans', -apple-system, sans-serif;
    background: linear-gradient(135deg, var(--navy) 0%, #060a16 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--navy-light);
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 12px;
    padding: 40px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    color: var(--gold-light);
    margin-bottom: 8px;
  }
  p.sub {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 28px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  input[type="email"] {
    width: 100%;
    padding: 12px 14px;
    background: #0b1224;
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 6px;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 20px;
  }
  input[type="email"]:focus {
    outline: none;
    border-color: var(--gold);
  }
  button {
    width: 100%;
    padding: 13px;
    background: var(--gold);
    color: #0b1224;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: var(--gold-light); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg {
    margin-top: 18px;
    font-size: 14px;
    line-height: 1.5;
    padding: 12px 14px;
    border-radius: 6px;
    display: none;
  }
  .msg.success {
    display: block;
    background: rgba(212,175,55,0.12);
    border: 1px solid rgba(212,175,55,0.3);
    color: var(--gold-light);
  }
  .msg.error {
    display: block;
    background: rgba(220,80,80,0.12);
    border: 1px solid rgba(220,80,80,0.3);
    color: #f0a0a0;
  }
  .back {
    display: inline-block;
    margin-top: 24px;
    color: var(--text-dim);
    font-size: 13px;
    text-decoration: none;
  }
  .back:hover { color: var(--gold-light); }
</style>
</head>
<body>
  <div class="card">
    <h1>Forgot your password?</h1>
    <p class="sub">Enter the email you signed up with and we'll send you a link to reset your password.</p>
    <form id="forgotForm">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com">
      <button type="submit" id="submitBtn">Send reset link</button>
    </form>
    <div class="msg" id="msg"></div>
    <a href="/admin.html" class="back">&larr; Back to login</a>
  </div>

  <script>
    const form = document.getElementById('forgotForm');
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      btn.disabled = true;
      btn.textContent = 'Sending...';
      msg.className = 'msg';
      msg.textContent = '';

      try {
        const res = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json().catch(() => ({}));

        msg.className = 'msg success';
        msg.textContent = (data && data.message) ||
          "If an account exists for that email, we've sent a password reset link.";
        form.reset();
      } catch (err) {
        msg.className = 'msg error';
        msg.textContent = 'Something went wrong. Please try again in a moment.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send reset link';
      }
    });
  </script>
</body>
</html>

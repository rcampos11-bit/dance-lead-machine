<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dance Lead Machine™ Studio — Chat with Us</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .layout-solo { max-width: 760px; margin: 32px auto; padding: 0 16px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">DL</div>
      <div>
        <h1>Dance Lead Machine™ Studio</h1>
        <p>Ask us anything — wedding dances, private lessons, kids classes, and more.</p>
      </div>
    </div>
  </header>

  <div class="layout-solo">
    <div class="card chat-card">
      <div class="chat-header">
        <div>
          <h2><span class="status-dot"></span>Chat with us</h2>
          <div class="sub">We usually reply in seconds.</div>
        </div>
      </div>
      <div class="messages" id="messages"></div>
            <div class="composer">
        <input id="input" type="text" placeholder="Type a message, e.g. 'Hi, do you offer wedding dance lessons?'" autocomplete="off">
        <button class="reset" id="resetBtn" title="Start a new conversation">New Conversation</button>
        <button id="sendBtn">Send</button>
      </div>
    </div>
    <footer style="text-align:center; margin-top:16px; font-size:12px; color:var(--muted);">
      By chatting with us, you agree to our
      <a href="https://countrywestcoastswing.dance/terms-and-conditions" style="color:var(--muted);">Terms &amp; Conditions</a>
      and
      <a href="https://countrywestcoastswing.dance/privacy-policy" style="color:var(--muted);">Privacy Policy</a>.
    </footer>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/chat.js?v=4"></script>
</body>
</html>
